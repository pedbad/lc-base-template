<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="24"
  height="24"
  role="presentation"
  aria-hidden="true"
>
  <!--
    logo.svg — the course's brand mark, shown beside the course title in the header
    and named by `logo` in course.json (checked by src/config/course.config.ts).

    THIS IS A PLACEHOLDER. Replace it with the real course mark when cloning the
    template. Three things to preserve when you do, because the header relies on them:

      1. SHAPE ONLY — the mark is painted as a SILHOUETTE. The header masks this file
         and tints it with `currentColor`, so it takes the header's text colour in
         both themes from one file. Every fill, stroke, opacity and gradient in here
         is therefore IGNORED at render; only the outline of the artwork survives.
         Do not spend time colouring a replacement. If the course's real mark must be
         full-colour, it needs the footer's pattern instead — a light/dark pair with
         `dark:hidden` (see src/components/shell/FooterMarks.tsx) — which is a code
         change, not a file swap.
      2. A SQUARE viewBox. The header sizes the mark by height and lets width follow;
         a non-square box will not be cropped, but it will not sit on the title's cap
         height either.
      3. `role="presentation"` + `aria-hidden="true"`. Harmless belt-and-braces: a
         masked file is never in the accessibility tree anyway, but keep them so the
         file is also safe to drop into an <img> somewhere else.

    Speech bubbles because the template ships as a language course. Nothing in the
    code depends on the shape — only on the three rules above.
  -->
  <path
    fill="currentColor"
    d="M9.5 3h8A3.5 3.5 0 0 1 21 6.5v5a3.5 3.5 0 0 1-3.5 3.5H17v2.6a.9.9 0 0 1-1.45.71L12.1 15H9.5A3.5 3.5 0 0 1 6 11.5v-5A3.5 3.5 0 0 1 9.5 3Z"
  />
  <path
    fill="currentColor"
    opacity=".45"
    d="M4.5 8H5v3.5A4.5 4.5 0 0 0 9.5 16h3.05l1.9 1.5H9.6l-3.15 2.44A.9.9 0 0 1 5 19.23V16.5h-.5A3.5 3.5 0 0 1 1 13V11.5A3.5 3.5 0 0 1 4.5 8Z"
