<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!--
    chart.svg — placeholder bar chart for the example tabs block (tab C,
    lo-00-example/blocks/04-tabs): café visits per day, peaking on Saturday. The alt
    text and caption in block.json carry its meaning. Hex literals are deliberate
    HERE, as in hero.svg: an <img> cannot read the page's CSS tokens.
  -->
  <rect width="800" height="450" fill="#ffffff" />
  <g fill="#1f4e6b">
    <rect x="70" y="250" width="70" height="150" />
    <rect x="170" y="230" width="70" height="170" />
    <rect x="270" y="210" width="70" height="190" />
    <rect x="370" y="190" width="70" height="210" />
    <rect x="470" y="140" width="70" height="260" />
    <rect x="570" y="60" width="70" height="340" />
    <rect x="670" y="170" width="70" height="230" />
  </g>
  <line x1="50" y1="400" x2="760" y2="400" stroke="#333333" stroke-width="2" />
  <g fill="#333333" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="105" y="430">Mon</text>
    <text x="205" y="430">Tue</text>
    <text x="305" y="430">Wed</text>
    <text x="405" y="430">Thu</text>
    <text x="505" y="430">Fri</text>
    <text x="605" y="430">Sat</text>
    <text x="705" y="430">Sun</text>
  </g>

  <!-- Size label for designers (maintainer, 2026-10-08): the slot, the size to SUPPLY
       (2x), the largest size it is SHOWN at (measured on the built site) and this
       file's path. Discreet, top-right, in the info alert's style: callout-info ground,
       primary border and icon, foreground text (literals: an <img> cannot read CSS
       tokens). Replace the whole file with the real artwork. Pinned by
       src/build/placeholder-labels.test.ts. -->
  <g data-label-position="top-right" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="539.2" y="7.6" width="253.2" height="44" rx="3.8" fill="#d1f9f1" stroke="#133844" stroke-width="0.8" />
    <g fill="none" stroke="#133844" stroke-width="1.1" stroke-linecap="round">
      <circle cx="550.6" cy="17.5" r="4.8" />
      <path d="M550.6 17.3v2.4M550.6 15.5h0.01" />
    </g>
    <g fill="#232830">
      <text x="560.5" y="21.3" font-size="9.1" font-weight="700">Tab figure · supply 2112 × 1188 px (16:9)</text>
      <text x="560.5" y="33" font-size="8.4">Shown up to 1052 × 593</text>
      <text x="560.5" y="44.7" font-size="8.4" font-family="ui-monospace, 'SF Mono', Menlo, monospace">public/images/lo-00-example/04-tabs/chart.svg</text>
    </g>
  </g>
</svg>
