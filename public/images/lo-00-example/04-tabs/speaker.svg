<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    speaker.svg — placeholder portrait for the example tabs block (tab B,
    lo-00-example/blocks/04-tabs). Authors replace it with a photo of the speaker.
    Hex literals are deliberate HERE, as in hero.svg: an <img> is a separate document
    and cannot read the page's CSS tokens.
  -->
  <rect width="400" height="400" fill="#e6eef2" />
  <circle cx="200" cy="155" r="70" fill="#8aa4b4" />
  <path d="M70 400c0-80 58-140 130-140s130 60 130 140z" fill="#8aa4b4" />

  <!-- Size label for designers (maintainer, 2026-10-08): the slot, the size to SUPPLY
       (2x), the largest size it is SHOWN at (measured on the built site) and this
       file's path. Discreet, bottom-left, on the amber-soft token with slate ink (literals:
       an <img> cannot read CSS tokens). Replace the whole file with the real artwork.
       Pinned by src/build/placeholder-labels.test.ts. -->
  <g data-label-position="bottom-left" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="11.8" y="321.6" width="376.5" height="66.6" rx="4.7" fill="#e9a93a" />
    <g fill="#232830">
      <text x="21" y="342.3" font-size="13.8" font-weight="700">Tab portrait · supply 680 × 680 px (1:1)</text>
      <text x="21" y="360.1" font-size="12.7">Shown up to 340 × 340</text>
      <text x="21" y="377.9" font-size="12.7" font-family="ui-monospace, 'SF Mono', Menlo, monospace">public/images/lo-00-example/04-tabs/speaker.svg</text>
    </g>
  </g>
</svg>
