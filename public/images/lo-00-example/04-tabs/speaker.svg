<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    speaker.svg — placeholder portrait for the example tabs block (tab B,
    lo-00-example/blocks/04-tabs). Authors replace it with a photo of the speaker.
    Hex literals are deliberate HERE, as in hero.svg: an <img> is a separate document
    and cannot read the page's CSS tokens.
  -->
  <rect width="400" height="400" fill="#e6eef2" />
  <circle cx="200" cy="155" r="70" fill="#8aa4b4" />
  <path d="M70 400c0-80 58-140 130-140s130 60 130 140z" fill="#8aa4b4" />

  <!-- Size label for designers (maintainer, 2026-10-08): the slot, the size to SUPPLY
       (2x), the largest size it is SHOWN at (measured on the built site) and this
       file's path. Discreet, top-right, in the info alert's style: callout-info ground,
       primary border and icon, foreground text (literals: an <img> cannot read CSS
       tokens). Replace the whole file with the real artwork. Pinned by
       src/build/placeholder-labels.test.ts. -->
  <g data-label-position="top-right" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="11.8" y="11.8" width="376.5" height="62.9" rx="5.9" fill="#d1f9f1" stroke="#133844" stroke-width="1.2" />
    <g fill="none" stroke="#133844" stroke-width="1.8" stroke-linecap="round">
      <circle cx="28.1" cy="25.9" r="6.7" />
      <path d="M28.1 25.6v3.4M28.1 23.1h0.01" />
    </g>
    <g fill="#232830">
      <text x="42.2" y="31.3" font-size="13" font-weight="700">Tab portrait · supply 680 × 680 px (1:1)</text>
      <text x="42.2" y="48.1" font-size="12">Shown up to 340 × 340</text>
      <text x="42.2" y="64.8" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">public/images/lo-00-example/04-tabs/speaker.svg</text>
    </g>
  </g>
</svg>
