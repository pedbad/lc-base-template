<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  role="presentation"
  aria-hidden="true"
>
  <!--
    hero.svg — the example LO's hero banner art (`"hero"` in lo-00-example/lo.json).
    A wide, quiet placeholder that shows the crop and the title panel without
    pretending to be course art. Authors replace it per LO with a WebP/AVIF about
    2000px wide.

    Decorative: LoHero renders it with alt="" because the <h1> names the page.

    NO INTRINSIC SIZE (maintainer, 2026-10-08): the root has no viewBox and is 100% by
    100%, so it fills the banner exactly, whatever the crop. The artwork sits in a
    nested 1600 x 500 svg with preserveAspectRatio slice, which is the same cover crop
    LoHero gives a real image; the size label hangs from the BOX's top-right corner,
    as on every other placeholder. Drawn in the artwork's own corner it fell outside
    the banner on a phone and at wide screens. Pinned by
    src/build/placeholder-labels.test.ts.

    Hex literals are deliberate HERE, as in lo-placeholder.svg: an <img> is a separate
    document and cannot read the page's CSS custom properties. Values are copied from
    src/styles/palette.css (Cambridge Light Blue / Blue / Warm Blue / Dark Blue) and
    must follow it if the palette changes. The calm upper-left keeps the title panel's
    corner uncluttered.
  -->
  <style>
    .label {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    @media (max-width: 480px) {
      .label {
        transform: scale(0.75);
      }
    }

    @media (max-width: 360px) {
      .label {
        transform: scale(0.66);
      }
    }
  </style>

  <svg width="100%" height="100%" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="lo-hero-sky" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d1f9f1" />
        <stop offset="1" stop-color="#8ee8d8" />
      </linearGradient>
    </defs>

    <rect width="1600" height="500" fill="url(#lo-hero-sky)" />

    <!-- Two speech bubbles on the right: the conversation motif of the card placeholder. -->
    <g fill="none" stroke="#133844" stroke-linecap="round" stroke-linejoin="round">
      <g opacity="0.14" stroke-width="22">
        <path d="M1004 262h196a36 36 0 0 0 36-36v-96a36 36 0 0 0-36-36h-196a36 36 0 0 0-36 36v96a36 36 0 0 0 36 36h6l-20 52 58-52" />
      </g>
      <g opacity="0.28" stroke-width="18">
        <path d="M1250 362h220a36 36 0 0 0 36-36v-112a36 36 0 0 0-36-36h-220a36 36 0 0 0-36 36v112a36 36 0 0 0 36 36h8l-18 44 50-44" />
      </g>
    </g>

    <g stroke="#00bdb6" stroke-linecap="round" stroke-width="14" opacity="0.55">
      <path d="M1264 256h164" />
      <path d="M1264 302h118" />
    </g>
  </svg>

  <!-- Size label for designers (maintainer, 2026-10-08): the slot, the size to SUPPLY
       (2x), the largest size it is SHOWN at (measured on the built site) and this
       file's path. Top-right of the banner, 12px in, in the info alert's style:
       callout-info ground, primary border and icon, foreground text (literals: an
       <img> cannot read CSS tokens). Drawn in px leftward from the right edge, so a
       narrow banner scales it toward that corner. Replace the whole file with the
       real artwork. -->
  <svg x="100%" y="0" overflow="visible">
    <g data-label-position="top-right" class="label" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <rect x="-408" y="12" width="396" height="58" rx="5" fill="#d1f9f1" stroke="#133844" stroke-width="1" />
      <g fill="none" stroke="#133844" stroke-width="1.5" stroke-linecap="round">
        <circle cx="-393" cy="25" r="6.2" />
        <path d="M-393 24.7v3.2M-393 22.4h0.01" />
      </g>
      <g fill="#232830">
        <text x="-380" y="30" font-size="12" font-weight="700">Hero banner · supply 3840 × 896 px</text>
        <text x="-380" y="45.5" font-size="11">Shown full width, 224–448 tall, cropped: keep content central</text>
        <text x="-380" y="61" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace">public/images/lo-00-example/hero.svg</text>
      </g>
    </g>
  </svg>
</svg>
