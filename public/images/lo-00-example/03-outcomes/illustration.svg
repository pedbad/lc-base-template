<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 400"
  width="600"
  height="400"
  role="presentation"
  aria-hidden="true"
>
  <!--
    illustration.svg — placeholder for the example LO's outcomes illustration
    (lo-00-example/blocks/03-outcomes, `content.image`). Same art as
    lo-placeholder.svg, its own size label.

    Purely decorative: cards render it with alt="" and aria-hidden, so it carries no
    text and needs no accessible name. Authors replace it per LO; it exists so a
    fresh clone's cards look finished rather than half-authored.

    Hex literals are deliberate HERE and only here: an <img> is a separate document
    and cannot read the page's CSS custom properties, so the token chain cannot
    reach inside it. Values are copied from src/styles/palette.css (Cambridge Light
    Blue / Blue / Warm Blue / Dark Blue) — keep them in step if the palette changes.
    Mid-tone by design, so it sits well on both the light and dark card surface.
  -->
  <defs>
    <linearGradient id="lo-placeholder-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1f9f1" />
      <stop offset="1" stop-color="#8ee8d8" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#lo-placeholder-bg)" />

  <!-- Two overlapping speech bubbles: a conversation, the unit of a language course. -->
  <g fill="none" stroke="#133844" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.14" stroke-width="18">
      <path d="M104 232h132a28 28 0 0 0 28-28v-72a28 28 0 0 0-28-28H104a28 28 0 0 0-28 28v72a28 28 0 0 0 28 28h4l-16 40 44-40" />
    </g>
    <g opacity="0.28" stroke-width="14">
      <path d="M300 300h180a28 28 0 0 0 28-28v-92a28 28 0 0 0-28-28H300a28 28 0 0 0-28 28v92a28 28 0 0 0 28 28h6l-14 34 38-34" />
    </g>
  </g>

  <!-- Speech lines inside the front bubble — suggestion of text, not glyphs. -->
  <g stroke="#00bdb6" stroke-linecap="round" stroke-width="12" opacity="0.55">
    <path d="M312 206h132" />
    <path d="M312 244h96" />
  </g>

  <!-- Size label for designers (maintainer, 2026-10-08): the size to SUPPLY (2x) and
       the largest size the slot is SHOWN at, measured on the built site. Replace the
       whole file with the real artwork. Pinned by src/build/placeholder-labels.test.ts. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#133844">
    <rect x="20" y="270" width="450" height="110" rx="10" fill="#ffffff" fill-opacity="0.88" stroke="#133844" stroke-opacity="0.2" />
    <text x="35" y="306" font-size="24" font-weight="700">Outcomes illustration</text>
    <text x="35" y="334" font-size="18">Supply 1920 × 1280 px · 3:2</text>
    <text x="35" y="360" font-size="18" fill-opacity="0.8">Shown up to 959 × 639 (532 × 355 on desktop)</text>
  </g>
</svg>
