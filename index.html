<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Head asset hrefs go through Vite's BASE_URL token, never a relative or
         root-absolute path (carry-forward anti-pattern #28): a relative href resolves
         against the CURRENT page URL, so it 404s on any path-slug route, and a
         root-absolute one 404s under a non-root base. (Don't write the token itself in
         a comment — Vite substitutes it there too.) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Starter template for building accessible, interactive language-course exercise engines with React and Vite."
    />
    <title>lc-base-template</title>
    <script>
      // Pre-hydration theme. Prerendered HTML cannot know the reader's stored choice,
      // so the `.dark` class is stamped here — synchronously, before first paint — or
      // every dark-theme reader gets a flash of the light theme. Deliberately inline
      // and module-free: an imported module is deferred, which is too late. Mirrors
      // resolveInitialTheme() in src/hooks/useTheme.ts — keep the two in sync. (A CSP,
      // if one is added later, needs a nonce here.)
      (function () {
        try {
          var stored = localStorage.getItem('lc-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (error) {
          // storage or matchMedia unavailable — the light default stands
        }
      })();

      // Pre-hydration ARMING for the back-to-top reveal, and it is here for exactly
      // the reason the theme is: prerendered HTML already contains the buttons, so
      // arming them from a module (deferred) or a React effect (post-paint) would
      // paint them visible, then hide them, then fade — a flash on every load.
      //
      // FAIL-SAFE BY OMISSION. The stylesheet only hides a button when this class is
      // present, so JS off, no IntersectionObserver, or a reader who asked for
      // reduced motion all mean the buttons are plainly visible and nothing is
      // hidden waiting for a script that will never run. Reduced motion opts OUT
      // entirely rather than getting an instant hide-then-show, because appearing
      // is the motion.
      (function () {
        try {
          if (
            'IntersectionObserver' in window &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            document.documentElement.classList.add('js-reveal');
          }
        } catch (error) {
          // matchMedia unavailable — leave unarmed, i.e. buttons visible
        }
      })();
    </script>
  </head>
  <body>
    <!-- Empty and UNSTAMPED: no data-lo-folder here means "the course landing page"
         (Phase D). main.tsx branches on that attribute, so this one template serves
         both pages — the dev server renders the landing page from it, and the
         post-build prerender pass stamps a folder onto each generated LO page. It
         used to pin lo-00-example, which made `/` a duplicate of example.html and
         left any second LO an orphan nothing linked to. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
