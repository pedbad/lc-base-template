name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      # v5+ declares `using: node24`. v4 declared node20, which GitHub is retiring
      # from its runners — it kept working only because runners force node20 actions
      # onto Node 24 anyway, i.e. on a runtime the action never claimed to support.
      # This pins the declaration to the runtime it actually runs on.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      # `bun run` hands Vite, Vitest, ESLint and Prettier to Node when Node is on the
      # PATH, so CI pins the same Node as `.nvmrc` instead of whatever the runner image
      # ships (TODO §E15). An exact tag, not `@v7`: when adopted, the moving major tag
      # pointed at a release younger than the two weeks this repo waits before adopting.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Lint styles (Stylelint)
        run: bun run lint:css

      - name: Check formatting (Prettier)
        run: bun run format:check

      # Coverage only here, not in the pre-push hook: per-file bars fail a pull
      # request whose new code has no test (docs/TOOLING.md, "Coverage").
      - name: Test with coverage (Vitest)
        run: bun run test:coverage

      - name: Build (tsc + vite)
        run: bun run build

  # The browser suite (TODO §E12, docs/TOOLING.md "Browser tests"): the BUILT site in
  # Chromium, Firefox and WebKit, once per kind of build. The default `./` build is built
  # once and served from a nested folder it knows nothing about, so an address that works
  # only at / (or resolves against the wrong file) fails here; a fixed BASE_URL build is
  # served at its own address. Beside `verify`, not after it, so both report at once.
  # Once per build too (§E12c): the course build runs every spec but e2e/debug/, the
  # DEBUG=1 build only e2e/debug/ (the debug pages' own cases); playwright.config.ts
  # picks the suite from the same DEBUG the build reads. Set on those two steps only (the
  # `debug` npm convention reads DEBUG too); an empty DEBUG is off.
  e2e:
    name: Browser tests (${{ matrix.site.name }}${{ matrix.debug && ', DEBUG=1' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site:
          - { name: './ from /any/folder/', base: '', serve: '/any/folder/' }
          - { name: '/course/', base: '/course/', serve: '' }
        debug: [false, true]
    env:
      BASE_URL: ${{ matrix.site.base }}
      SERVE_PATH: ${{ matrix.site.serve }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      # Playwright's runner is Node, not Bun.
      # `bun run` hands Vite, Vitest, ESLint and Prettier to Node when Node is on the
      # PATH, so CI pins the same Node as `.nvmrc` instead of whatever the runner image
      # ships (TODO §E15). An exact tag, not `@v7`: when adopted, the moving major tag
      # pointed at a release younger than the two weeks this repo waits before adopting.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browsers are ~500 MB; cache them per Playwright version. The Linux system
      # libraries are installed either way (below), since the cache cannot hold them. Browsers are
      # built per distro, so the key also names the runner image ($ImageOS, read here
      # because the `env` context holds only workflow keys): an image move misses.
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      # An exact tag, not `@v6`, for the same reason as setup-node above.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium firefox webkit

      # The system libraries come from apt (~120 MB on a fresh runner), which sometimes
      # stalls: on 2026-10-23 three jobs sat here until the 15-minute job limit and were
      # cancelled before a test ran. Killing apt from outside and retrying does not work:
      # a killed install leaves dpkg locked, and every retry fails at once (tried in this
      # PR). So apt is told to give up on a silent connection after 30 s and retry it
      # itself, which ends a stall without cutting a slow but moving download short. The
      # step limit is the backstop, so a hang costs at most 10 minutes, not the job.
      - name: Make apt retry a stalled download
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network-retries

      - name: Install browser system libraries
        timeout-minutes: 10
        run: bunx playwright install-deps chromium firefox webkit

      # The runner has no sound device, so Firefox cannot play audio there
      # (NS_ERROR_DOM_MEDIA_MEDIASINK_ERR) and a clip's currentTime never moves. A
      # PulseAudio null sink gives it one. Without it, e2e/debug/sequence-scrub.spec.ts
      # passed only because a stale playlist timer jumped clips (TODO §E28, PR 31).
      - name: Start a virtual sound device
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - name: Build
        run: bun run build
        env:
          DEBUG: ${{ matrix.debug && '1' || '' }}

      - name: Browser tests (Playwright)
        run: bun run test:e2e
        env:
          DEBUG: ${{ matrix.debug && '1' || '' }}

      # An exact tag, not `@v7`, for the same reason as setup-node above.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # A "re-run failed jobs" uploads under the same name; replace, do not collide.
          overwrite: true
