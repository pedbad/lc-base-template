name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      # v5+ declares `using: node24`. v4 declared node20, which GitHub is retiring
      # from its runners — it kept working only because runners force node20 actions
      # onto Node 24 anyway, i.e. on a runtime the action never claimed to support.
      # This pins the declaration to the runtime it actually runs on.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Lint styles (Stylelint)
        run: bun run lint:css

      - name: Check formatting (Prettier)
        run: bun run format:check

      - name: Test (Vitest)
        run: bun run test

      - name: Build (tsc + vite)
        run: bun run build
